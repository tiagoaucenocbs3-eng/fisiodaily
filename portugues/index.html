<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4f4f4">
  <title>Verificação de segurança</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="config.js"></script>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1085333620713153');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1085333620713153&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <main class="verify-page">
    <section class="verify-wrap" aria-label="Verificação de segurança">
      <div class="verify-title">
        <span class="title-icon" aria-hidden="true"><span class="title-check">✓</span></span>
        <span id="titleText">Verificação de segurança</span>
      </div>

      <button id="verifyBox" class="captcha-box" type="button" aria-label="Confirmar verificação">
        <span id="checkbox" class="captcha-checkbox" aria-hidden="true"></span>
        <span id="checkboxText" class="captcha-label">Não sou um robô</span>
        <span class="captcha-brand" aria-hidden="true">
          <span class="google-g">G</span>
          <span class="recaptcha-name">reCAPTCHA</span>
          <span id="recaptchaLinks" class="recaptcha-links"><span>Privacidade</span><span>Termos</span></span>
        </span>
      </button>

      <div id="footerText" class="verify-footer">Protegido por verificação · Privacidade · Termos</div>
      <div id="errorBox" style="display:none; color:#c62828; font-size:12px; margin-top:10px; line-height:1.4; text-align:center;"></div>
    </section>
  </main>

  <script>
    const cfg = window.PRESELL_CONFIG || {};
    const title = cfg.title || 'Verificação de segurança';
    const checkboxText = cfg.checkboxText || 'Não sou um robô';
    const footerText = cfg.footerText || 'Protegido por verificação · Privacidade · Termos';
    const errorMessage = cfg.errorMessage || 'Não foi possível continuar neste momento. Tente novamente.';
    const delayAfterClick = Number(cfg.delayAfterClick || 600);

    document.title = title;
    document.getElementById('titleText').textContent = title;
    document.getElementById('checkboxText').textContent = checkboxText;
    document.getElementById('footerText').textContent = footerText;

    const box = document.getElementById('verifyBox');
    const check = document.getElementById('checkbox');
    const errorBox = document.getElementById('errorBox');
    let isProcessing = false;

    // Dispara evento no Meta Pixel ao clicar
    function fireTrackingEvent() {
      try {
        if (window.fbq && typeof window.fbq === 'function') {
          window.fbq('trackCustom', 'ClickButton');
        }
      } catch (e) {
        console.warn('Tracking event error:', e);
      }
    }

    function getDestinationUrl() {
      const baseDestination = cfg.destinationUrl || 'https://pay.wiapy.com/JErhaN8O_CGI';
      try {
        const targetUrl = new URL(baseDestination, window.location.href);
        const currentParams = new URLSearchParams(window.location.search);
        currentParams.forEach((val, key) => {
          targetUrl.searchParams.set(key, val);
        });
        return targetUrl.toString();
      } catch (e) {
        const search = window.location.search;
        if (!search) return baseDestination;
        const sep = baseDestination.includes('?') ? '&' : '?';
        return baseDestination + sep + search.replace(/^\?/, '');
      }
    }

    box.addEventListener('click', () => {
      if (isProcessing) return;
      isProcessing = true;

      if (errorBox) {
        errorBox.style.display = 'none';
        errorBox.textContent = '';
      }

      box.classList.add('loading');
      check.innerHTML = '<span class="spinner"></span>';

      fireTrackingEvent();

      setTimeout(() => {
        try {
          box.classList.remove('loading');
          box.classList.add('checked');
          check.textContent = '✓';

          const finalCheckoutUrl = getDestinationUrl();
          setTimeout(() => {
            window.location.href = finalCheckoutUrl;
          }, 150);
        } catch (err) {
          console.error('Erro ao redirecionar:', err);
          box.classList.remove('loading');
          box.classList.remove('checked');
          check.innerHTML = '';
          isProcessing = false;

          if (errorBox) {
            errorBox.textContent = errorMessage;
            errorBox.style.display = 'block';
          }
        }
      }, delayAfterClick);
    });
  </script>
</body>
</html>
