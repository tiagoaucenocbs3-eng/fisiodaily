<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4f4f4">
  <title>Verificación de seguridad</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js"></script>

<body>
  <main class="verify-page">
    <section class="verify-wrap" aria-label="Verificación de seguridad">
      <div class="verify-title">
        <span class="title-icon" aria-hidden="true"><span class="title-check">✓</span></span>
        <span id="titleText">Verificación de seguridad</span>
      </div>

      <button id="verifyBox" class="captcha-box" type="button" aria-label="Confirmar verificación">
        <span id="checkbox" class="captcha-checkbox" aria-hidden="true"></span>
        <span id="checkboxText" class="captcha-label">No soy un robot</span>
        <span class="captcha-brand" aria-hidden="true">
          <span class="google-g">G</span>
          <span class="recaptcha-name">reCAPTCHA</span>
          <span id="recaptchaLinks" class="recaptcha-links"><span>Privacidad</span><span>Términos</span></span>
        </span>
      </button>

      <div id="footerText" class="verify-footer">Protegido por verificación · Privacidad · Términos</div>
      <div id="errorBox" style="display:none; color:#c62828; font-size:12px; margin-top:10px; line-height:1.4; text-align:center;"></div>
    </section>
  </main>

  <script>
    const cfg = window.PRESELL_CONFIG || {};
    const title = cfg.title || 'Verificación de seguridad';
    const checkboxText = cfg.checkboxText || 'No soy un robot';
    const footerText = cfg.footerText || 'Protegido por verificación · Privacidad · Términos';
    const errorMessage = cfg.errorMessage || 'No fue posible continuar en este momento. Inténtalo de nuevo.';
    
    document.title = title;
    document.getElementById('titleText').textContent = title;
    document.getElementById('checkboxText').textContent = checkboxText;
    document.getElementById('footerText').textContent = footerText;

    const box = document.getElementById('verifyBox');
    const check = document.getElementById('checkbox');
    const errorBox = document.getElementById('errorBox');
    let isProcessing = false;

    // Dispara evento del TikTok Pixel con seguridad si está disponible
    function fireTrackingEvent() {
      try {
        if (window.ttq && typeof window.ttq.track === 'function') {
          window.ttq.track('ClickButton');
        }
      } catch (e) {
        console.warn('Tracking event error:', e);
      }
    }

    // Obtiene la ruta de la API manteniendo los parámetros de campaña (UTMs, ttclid, etc.)
    function getApiUrl() {
      const apiUrl = cfg.whatsappApiUrl || '/api/whatsapp';
      const search = window.location.search;
      if (!search) return apiUrl;
      const separator = apiUrl.includes('?') ? '&' : '?';
      return apiUrl + separator + search.substring(1);
    }

    // Procesa el clic voluntario del visitante
    box.addEventListener('click', async () => {
      // Protección contra doble clic
      if (isProcessing) return;
      isProcessing = true;

      // Limpia mensajes de error previos
      if (errorBox) {
        errorBox.style.display = 'none';
        errorBox.textContent = '';
      }

      // Estado visual de carga (spinner)
      box.classList.add('loading');
      check.innerHTML = '<span class="spinner"></span>';

      // Dispara el evento de conversión en TikTok Pixel
      fireTrackingEvent();

      try {
        const targetApiUrl = getApiUrl();
        const response = await fetch(targetApiUrl, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error('Fallo en la respuesta del servidor');
        }

        const data = await response.json();

        if (data && data.url) {
          const delay = Number(cfg.delayAfterClick || 650);
          setTimeout(() => {
            box.classList.remove('loading');
            box.classList.add('checked');
            check.textContent = '✓';

            if (cfg.redirectAfterVerify !== false) {
              window.location.href = data.url;
            }
          }, delay);
        } else {
          throw new Error('URL de redirección no retornada');
        }
      } catch (err) {
        console.error('Error en la redirección:', err);
        // En caso de error: rehabilita el botón y muestra mensaje amigable
        box.classList.remove('loading');
        check.innerHTML = '';
        isProcessing = false;

        if (errorBox) {
          errorBox.textContent = errorMessage;
          errorBox.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
